<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="770" viewBox="0 0 1180 770" role="img" aria-labelledby="title desc"><title id="title">Revslot recovery architecture</title><desc id="desc">Merchant and consumer connect to a FastAPI session, deterministic pricing and a validated Nebius plan. A policy gate controls publication and revision-checked booking. Tavily is optional; live API credentials remain unverified.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9baa94"/></marker></defs><rect width="100%" height="100%" fill="#f8faf5"/><path d="M350,80 L445,80" stroke="#a3b29a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M830,80 L735,80" stroke="#a3b29a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M590,120 L590,190" stroke="#a3b29a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M350,233 L445,233" stroke="#a3b29a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M830,233 L735,233" stroke="#a3b29a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M590,275 L590,355" stroke="#a3b29a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M830,398 L735,398" stroke="#a3b29a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M445,398 L350,398" stroke="#a3b29a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M590,440 L590,520" stroke="#a3b29a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M590,605 L590,670" stroke="#a3b29a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M735,562 H780 V320 H590 V275" stroke="#a3b29a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="791" y="500" fill="#718367" font-size="12" font-family="Arial">Unsold</text><rect x="60" y="40" width="290" height="80" rx="12" fill="#fff" stroke="#d8e2ce"/><text x="205.0" y="72" text-anchor="middle" font-family="Arial" font-size="17" font-weight="600" fill="#415b35">Merchant calendar</text><text x="205.0" y="95" text-anchor="middle" font-family="Arial" font-size="11" fill="#7d906c">Cancellation + policy</text><rect x="830" y="40" width="290" height="80" rx="12" fill="#fff" stroke="#d8e2ce"/><text x="975.0" y="72" text-anchor="middle" font-family="Arial" font-size="17" font-weight="600" fill="#415b35">Consumer marketplace</text><text x="975.0" y="95" text-anchor="middle" font-family="Arial" font-size="11" fill="#7d906c">Shared offer + reservation</text><rect x="445" y="40" width="290" height="80" rx="12" fill="#fff" stroke="#d8e2ce"/><text x="590.0" y="72" text-anchor="middle" font-family="Arial" font-size="17" font-weight="600" fill="#415b35">FastAPI / Pydantic</text><text x="590.0" y="95" text-anchor="middle" font-family="Arial" font-size="11" fill="#7d906c">Isolated synthetic session</text><rect x="445" y="190" width="290" height="85" rx="12" fill="#eaf1e2" stroke="#d8e2ce"/><text x="590.0" y="222" text-anchor="middle" font-family="Arial" font-size="17" font-weight="600" fill="#415b35">LangGraph recovery</text><text x="590.0" y="245" text-anchor="middle" font-family="Arial" font-size="11" fill="#7d906c">Analyze → plan → execute</text><rect x="60" y="190" width="290" height="85" rx="12" fill="#fff" stroke="#d8e2ce"/><text x="205.0" y="222" text-anchor="middle" font-family="Arial" font-size="17" font-weight="600" fill="#415b35">Deterministic tools</text><text x="205.0" y="245" text-anchor="middle" font-family="Arial" font-size="11" fill="#7d906c">Forecast · pricing · matching</text><rect x="830" y="190" width="290" height="85" rx="12" fill="#fff" stroke="#d8e2ce"/><text x="975.0" y="222" text-anchor="middle" font-family="Arial" font-size="17" font-weight="600" fill="#415b35">Nebius + NVIDIA</text><text x="975.0" y="245" text-anchor="middle" font-family="Arial" font-size="11" fill="#7d906c">Validated plan · runtime key needed</text><rect x="445" y="355" width="290" height="85" rx="12" fill="#eaf1e2" stroke="#d8e2ce"/><text x="590.0" y="387" text-anchor="middle" font-family="Arial" font-size="17" font-weight="600" fill="#415b35">Merchant policy gate</text><text x="590.0" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#7d906c">Floor · margin · cap · approval</text><rect x="830" y="355" width="290" height="85" rx="12" fill="#fff" stroke="#d8e2ce"/><text x="975.0" y="387" text-anchor="middle" font-family="Arial" font-size="17" font-weight="600" fill="#415b35">Optional Tavily</text><text x="975.0" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#7d906c">Cited public context · safe fallback</text><rect x="60" y="355" width="290" height="85" rx="12" fill="#fff" stroke="#d8e2ce"/><text x="205.0" y="387" text-anchor="middle" font-family="Arial" font-size="17" font-weight="600" fill="#415b35">State + action audit</text><text x="205.0" y="410" text-anchor="middle" font-family="Arial" font-size="11" fill="#7d906c">SQLite / optional PostgreSQL</text><rect x="445" y="520" width="290" height="85" rx="12" fill="#fff" stroke="#d8e2ce"/><text x="590.0" y="552" text-anchor="middle" font-family="Arial" font-size="17" font-weight="600" fill="#415b35">Publish / observe / replan</text><text x="590.0" y="575" text-anchor="middle" font-family="Arial" font-size="11" fill="#7d906c">Real sandbox state · accelerated clock</text><rect x="445" y="670" width="290" height="65" rx="12" fill="#eaf1e2" stroke="#d8e2ce"/><text x="590.0" y="702" text-anchor="middle" font-family="Arial" font-size="17" font-weight="600" fill="#415b35">Booking → recovered revenue</text><text x="590.0" y="725" text-anchor="middle" font-family="Arial" font-size="11" fill="#7d906c">Atomic revision check · SSE updates</text></svg>