services:
  backend:
    build: ./backend
    environment:
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NEBIUS_MODEL: ${NEBIUS_MODEL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    volumes:
      - recovery-state:/state
  frontend:
    build: ./frontend
    environment:
      FASTAPI_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  recovery-state:
