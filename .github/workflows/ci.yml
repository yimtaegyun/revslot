name: Recovery verification
on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", "infrastructure/**", "scripts/**", "tests/**", "data/**", "simulation/**", "requirements*", "pyproject.toml", ".github/workflows/**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: revslot_ci
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: revslot_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U revslot_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TEST_DATABASE_URL: postgresql://revslot_ci:ephemeral_ci_only@127.0.0.1:5432/revslot_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements-dev.lock
      - run: .venv/bin/python -m pytest -q
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund && npm test && npm run build
        working-directory: infrastructure/neon
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run build:vercel
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm exec playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            frontend/e2e-captures/
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
